dns:
  enable: true
  listen: 127.0.0.1:1053
  enhanced-mode: redir-host
  ipv6: false
  prefer-h3: false
  respect-rules: false
  default-nameserver:
  - https://223.5.5.5/dns-query
  proxy-server-nameserver:
  - https://223.5.5.5/dns-query#DIRECT
  nameserver:
  - https://1.1.1.1/dns-query#住宅出口
  fallback:
  - https://8.8.8.8/dns-query#住宅出口
  direct-nameserver:
  - https://1.1.1.1/dns-query#住宅出口
  direct-nameserver-follow-policy: false
