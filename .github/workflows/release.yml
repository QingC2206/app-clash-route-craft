name: AOT Release

on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aot-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Validate and package Windows x64 AOT
    runs-on: windows-2022
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.version }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Check version and source privacy
        id: version
        run: python scripts/release-guard.py source --github-output
      - name: Install test dependencies
        run: python -m pip install 'paramiko>=3.5,<5'
      - name: Build, test and package
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/Build-Release.ps1
      - name: Retain only the verified public assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-x64-aot
          path: |
            releases/ClashRouteCraft-win-x64.zip
            releases/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7

  verify:
    name: Recheck downloaded assets on Linux
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-x64-aot
          path: releases
      - name: Verify archive, documentation and transfer checksum
        run: python3 scripts/release-guard.py verify

  publish:
    name: Publish the version tag
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [build, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-x64-aot
          path: releases
      - name: Verify and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 scripts/publish-release.py
